<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />

  <title>Manage Faculty</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      background: linear-gradient(90deg, darkgreen 0%, green 100%);
    }

    nav {
      width: 200px;
      background-color: white;

      padding-top: 20px;
      position: fixed;

      flex-direction: column;

    .logo-container {

      width: 120px;
      height: auto;

    nav ul {
      list-style: none;
      padding: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    nav ul li {

    }

    nav ul li button {

      background: none;
      border: none;
      color: black;

      padding: 15px;
      cursor: pointer;
      text-align: left;
    }

    nav ul li button:hover {
      background-color: darkgreen;
      color: white;
    }

    nav ul li button.active {
      background-color: darkgreen;
      color: white;
      font-weight: bold;
    }

    nav ul li button img {

    }

    nav ul li button:hover img {
      filter: brightness(0) invert(1);
    }

    nav ul li:last-child {
      margin-top: auto;
    }

    .main {
      margin-left: 220px;
      margin-top: 20px;
      padding: 20px;
      color: white;
      flex-grow: 1;
    }

    .main h1 {
      font-size: 36px;
      margin-top: 1px;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .page-header h1 {
      margin-top: 0;      
      padding-top: 0;      
      position: relative; 
      top: -80px;           
    }

    .top-right {
      position: absolute;
      top: 40px;
      right: 40px;
      display: flex;
      align-items: center;
      gap: 15px;
      color: white;
      font-weight: 600;
      font-family: 'Poppins', sans-serif;
    }

    .add-subject-btn {
      background: white;
      color: green;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    .notification {
      font-size: 17px;
      margin-bottom: 8px;
      cursor: pointer;
      position: relative;
    }

    .admininfo {
      display: flex;
      flex-direction: column;
      font-size: 18px;
      text-align: right;
      line-height: 1.1;
    }

    .admin-name {
      font-weight: 700;
    }

    .admin-role {
      font-weight: 400;
      font-size: 12px;
      opacity: 0.8;
    }

    .profile-icon {
      font-size: 34px;
      cursor: pointer;
    }

    .top-right {
      position: absolute;
      top: 40px;
      right: 40px;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .main {
      margin-left: 220px;
      margin-top: 40px;
      padding: 20px;
      color: white;
      flex-grow: 1;
    }

    .main h1 {
      font-size: 36px;
      margin-top: 1px;
    }

    .add-subject-btn {
      background: white;
      color: green;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    .button-group {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      table-layout: fixed;
      background: rgba(255, 255, 255, 0.1);
      text-align: center;
      border-radius: 10px;
      color: white;
      border-spacing: 0;
    }

    th, td {
      padding: 15px 12px;
      text-align: center;
    }

    th {
      font-size: 17px;
      background: rgba(255, 255, 255, 0.15);
    }

    td {
      font-size: 17px;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
    }

    .action-buttons {
      display: flex;
      gap: 5px;
    }

    .edit-btn, .delete-btn, .preview-btn {
      border: none;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      color: black;
    }

    .edit-btn { background: orange; }
    .delete-btn { background: orangered; }
    .preview-btn { background: lightblue; }

    #facultyModal, #previewModal {
      display: none;
      position: fixed;
      z-index: 1000;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      color: black;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
    }

    .modal-content {
      background-color: #eeeeee; 
      border-radius: 16px;
      padding: 30px;
      width: 380px;
      max-width: 90%;
      box-shadow: 0px 8px 30px rgba(0, 0, 0, 0.3);
      animation: popIn 0.25s ease-out;
    }

    @keyframes popIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-content h2 {
      margin: 0 0 20px;
      font-size: 22px;
      font-weight: 600;
      color: #1a1a1a;
      text-align: center;
    }

    .modal-content label {
      font-size: 14px;
      font-weight: 500;
      color: #333;
      display: block;
      margin-bottom: 4px;
    }

    .modal-content input,
    .modal-content select {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 15px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
    }

    .modal-actions {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 10px;
    }

    .modal-actions button {
      padding: 10px 20px;
      font-size: 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .cancel-btn { background-color: #e0e0e0; color: #333; }
    .save-btn { background-color: #28a745; color: white; }

    .cancel-btn:hover { background-color: #ccc; }
    .save-btn:hover { background-color: #218838; }

  </style>
</head>
<body>

  <nav>
    <div class="logo-container">
      <img src="http://bpc.edu.ph/wp-content/uploads/2024/12/LOGO-e1733733724127-160.png" alt="School Logo">
    </div>
    <ul>
      <li><a href="Dashboard.html"><button><i class="fas fa-home"></i> Dashboard</button></a></li>
      <li><a href="Manage-Faculty.html"><button class="active"><i class="fa-solid fa-user"></i> Manage Faculty</button></a></li>
      <li><a href="manage-Sections.html"><button><i class="fas fa-columns"></i> Manage Sections</button></a></li>
      <li><a href="Manage-Rooms.html"><button><i class="fas fa-chalkboard-teacher"></i> Manage Room</button></a></li>
      <li><a href="Manage-Subjects.html"><button><i class="fa-solid fa-book-open"></i> Manage Subject</button></a></li>
      <li><a href="User-Management.html"><button><i class="fas fa-user-friends"></i> User Management</button></a></li>
      <li><a href="Login.html"><button><i class="fas fa-power-off"></i> Logout</button></a></li>
  </nav>

  <!-- Main Section -->
  <div class="main">
    <div class="top-right">
      <div class="notification"><i class="fas fa-bell"></i></div>
      <div class="admininfo">
        <div class="admin-name">Maureen Dela Cruz</div>
        <div class="admin-role">MIS President</div>
      </div>
      <div class="profile-icon" onclick="goToSettings()"><i class="fas fa-user-circle"></i></div>
    </div>

    <h1>Faculty</h1>
    <div class="button-group">
      <button onclick="openModal()" class="add-subject-btn">+ Add Faculty</button>
      <button onclick="triggerImport()" class="add-subject-btn">Import Files</button>
      <input type="file" id="importFile" style="display:none;" onchange="importFacultyFile(event)">
    </div>

    <table id="facultysTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Type</th>
          <th>Subjects</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="facultysBody"></tbody>
    </table>

    <div id="facultyModal">
      <div class="modal-content">
        <h2 id="modalTitle">Add Faculty</h2>

        <input id="facultyID" type="hidden">

        <label for="facultyName">Name</label>
        <input id="facultyName" placeholder="Enter Name" />

        <label for="facultyType">Type</label>
        <select id="facultyType">
          <option disabled selected>Select Type</option>
          <option>Full Time</option>
          <option>Part Time</option>
        </select>

        <label for="facultySubjects">Subject Code</label>
        <input id="facultySubjects" placeholder="Enter Subject Code" />

        <div class="modal-actions">
          <button class="cancel-btn" onclick="closeModal()">Cancel</button>
          <button class="save-btn" onclick="saveFaculty()">Save</button>
        </div>
      </div>
    </div>

    <div id="previewModal">
      <div class="modal-content">
        <h2>Faculty Preview</h2>
        <p><strong>ID:</strong> <span id="previewID"></span></p>
        <p><strong>Name:</strong> <span id="previewName"></span></p>
        <p><strong>Type:</strong> <span id="previewType"></span></p>
        <p><strong>Subjects:</strong> <span id="previewSubjects"></span></p>
        <div class="modal-actions">
          <button class="cancel-btn" onclick="closePreview()">Close</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>


  <!-- Script Section -->
  <script>
  const faculties = [];
  let editIndex = null;

  function openModal(index = null) {
    document.getElementById("facultyModal").style.display = "flex";
    document.getElementById("modalTitle").textContent = index === null ? "Add Faculty" : "Edit Faculty";

    if (index !== null) {
      const faculty = faculties[index];
      document.getElementById("facultyID").value = faculty.id;
      document.getElementById("facultyName").value = faculty.name;
      document.getElementById("facultyType").value = faculty.type;
      document.getElementById("facultySubjects").value = faculty.subjects;
      editIndex = index;
    } else {
      document.getElementById("facultyID").value = faculties.length + 1;
      document.getElementById("facultyName").value = "";
      document.getElementById("facultyType").selectedIndex = 0;
      document.getElementById("facultySubjects").value = "";
      editIndex = null;
    }
  }

  function saveFaculty() {
    const id = document.getElementById("facultyID").value;
    const name = document.getElementById("facultyName").value;
    const type = document.getElementById("facultyType").value;
    const subjects = document.getElementById("facultySubjects").value;

    if (!id || !name || !type || !subjects) {
      alert("Please fill in all fields");
      return;
    }

    const facultyData = { id, name, type, subjects };

    if (editIndex !== null) {
      faculties[editIndex] = facultyData;
    } else {
      faculties.push(facultyData);
    }

    renderFaculties();
    closeModal();
  }

  function closeModal() {
    document.getElementById("facultyModal").style.display = "none";
  }

  function renderFaculties() {
    const body = document.getElementById("facultysBody");
    body.innerHTML = "";
    faculties.forEach((f, i) => {
      body.innerHTML += `
        <tr>
          <td>${f.id}</td>
          <td>${f.name}</td>
          <td>${f.type}</td>
          <td>${f.subjects}</td>
          <td>
            <div class="action-buttons">
              <button class="edit-btn" onclick="openModal(${i})">✏️ Edit</button>
              <button class="delete-btn" onclick="deleteFaculty(${i})">🗑️ Delete</button>
              <button class="preview-btn" onclick="previewFaculty(${i})">👁️ Preview</button>
            </div>
          </td>
        </tr>
      `;
    });
  }

  function deleteFaculty(index) {
    if (confirm("Are you sure you want to delete this faculty member?")) {
      faculties.splice(index, 1);
      renderFaculties();
    }
  }

  function previewFaculty(index) {
    const faculty = faculties[index];
    document.getElementById("previewID").textContent = faculty.id;
    document.getElementById("previewName").textContent = faculty.name;
    document.getElementById("previewType").textContent = faculty.type;
    document.getElementById("previewSubjects").textContent = faculty.subjects;
    document.getElementById("previewModal").style.display = "flex";
  }

  function closePreview() {
    document.getElementById("previewModal").style.display = "none";
  }

  function triggerImport() {
    document.getElementById("importFile").click();
  }

  function importFacultyFile(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function (e) {
      try {
        const importedData = JSON.parse(e.target.result);
        if (Array.isArray(importedData)) {
          importedData.forEach((f, i) => {
            if (f.name && f.type && f.subjects) {
              faculties.push({
                id: faculties.length + 1,
                name: f.name,
                type: f.type,
                subjects: f.subjects
              });
            }
          });
          renderFaculties();
          alert("Import successful!");
        } else {
          alert("Invalid file format. Please upload a valid JSON file.");
        }
      } catch (error) {
        alert("Failed to read file. Make sure it's valid JSON.");
      }
    };
    reader.readAsText(file);
  }

  // Sample seed data (no availDays or availTime)
  faculties.push(
    { id: "1", name: "Prof. Joana Cruz", type: "Full Time", subjects: "AD-HCI 123" },
    { id: "2", name: "Prof. Miguel Gatchalian", type: "Full Time", subjects: "CT-WD 123" }
  );

  renderFaculties();
</script>


</body>
</html>
